name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.2)'
        required: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\electron-builder\Cache
          key: electron-builder-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-cache-

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: npm run build

      - name: Package (Windows installer)
        run: npx electron-builder --publish never
        # electron-builder uses the already-built dist/ output from the previous step

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndi-comms-router-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ndi-comms-router-windows
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NDI Comms Router ${{ github.ref_name }}
          body: |
            ## NDI Comms Router ${{ github.ref_name }}

            ### Installation
            1. Download and run the `.exe` installer below
            2. Install [ndi-free-audio](https://github.com/ykhwong/ndi-free-audio) separately on both machines
            3. Launch the app and configure the path to `ndi-free-audio.exe` in Settings

            ### What's included
            - Windows NSIS installer (64-bit)
            - Both XR18 PC and Dante PC modes in one install
          files: |
            release/*.exe
            release/latest.yml
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
